plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://api.modrinth.com/maven"
                name = "Modrinth"
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release"
        name = "Quilt"
    }
    exclusiveContent { // ImGuiMC (optional helper-UI dependency)
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("foundry.imguimc")
        }
    }
    maven { // jgltf (de.javagl) - pure-Java glTF/GLB parser
        url = "https://repo.javagl.de/"
        name = "javagl Maven"
    }
}

def loaderPlatform = providers.gradleProperty("loader_platform").getOrElse("fabric")
if (!(loaderPlatform in ["fabric", "quilt"])) {
    throw new GradleException("Unsupported loader_platform '${loaderPlatform}'. Expected 'fabric' or 'quilt'.")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (loaderPlatform == "quilt") {
        implementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
        // Quilt Loader publishes the libraries supplied by its installer separately.
        implementation "org.quiltmc:quilt-loader-dependencies:${project.quilt_loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "maven.modrinth:iris:${project.iris_fabric_version}"
    localRuntime "maven.modrinth:iris:${project.iris_fabric_version}"
    localRuntime "maven.modrinth:sodium:${project.sodium_fabric_version}"

    include implementation("de.javagl:jgltf-model:2.0.4")
    include implementation("de.javagl:jgltf-impl-v2:2.0.4")
    include implementation("com.fasterxml.jackson.core:jackson-databind:2.13.4.2")
    include implementation("com.fasterxml.jackson.core:jackson-core:2.13.4")
    include implementation("com.fasterxml.jackson.core:jackson-annotations:2.13.4")

    implementation files("libs/bb4j.jar")

    implementation "org.lwjgl:lwjgl-assimp:${project.lwjgl_version}"
    include "org.lwjgl:lwjgl-assimp:${project.lwjgl_version}"
    ["natives-windows", "natives-linux", "natives-macos", "natives-macos-arm64"].each { platform ->
        runtimeOnly "org.lwjgl:lwjgl-assimp:${project.lwjgl_version}:${platform}"
        include "org.lwjgl:lwjgl-assimp:${project.lwjgl_version}:${platform}"
    }

    compileOnly("foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    compileOnly "io.github.spair:imgui-java-binding:1.92.0"
    localRuntime("foundry.imguimc:imguimc-fabric-26.1:${project.imguimc_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
}

loom {
    runs {
        irisClient {
            client()
            configName = "Amnetic Iris Client"
            ideConfigGenerated = true
            runDir loaderPlatform == "quilt" ? "build/run/quilt-iris" : "build/run/iris"
            providers.gradleProperty("quick_play_world").orNull?.with { world ->
                programArgs "--quickPlaySingleplayer", world
            }
        }
    }
}

if (loaderPlatform == "quilt") {
    def fabricApiJar = configurations.runtimeClasspath.incoming.artifactView {
        componentFilter { component ->
            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    component.group == "net.fabricmc.fabric-api" && component.module == "fabric-api"
        }
    }.files
    def imguiMcJar = configurations.runtimeClasspath.incoming.artifactView {
        componentFilter { component ->
            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    component.group == "foundry.imguimc" && component.module == "imguimc-fabric-26.1"
        }
    }.files
    def prepareQuiltRunMods = tasks.register("prepareQuiltRunMods", Sync) {
        dependsOn tasks.named("jar")
        from tasks.named("jar").flatMap { it.archiveFile }
        from fabricApiJar
        from imguiMcJar
        into layout.buildDirectory.dir("run/quilt/mods")
    }

    loom.runs.configureEach {
        if (name != "irisClient") {
            runDir "build/run/quilt"
        }
    }
    tasks.matching { it.name.startsWith("run") }.configureEach {
        dependsOn prepareQuiltRunMods
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
