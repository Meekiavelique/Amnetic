plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'net.minecraftforge.jarjar'
    id 'net.minecraftforge.renamer'
}

stonecutter {
    properties.tags(current.project.substring(0, current.project.lastIndexOf('-')))
}

version = "${findProperty('mod_version') ?: property('mod.version')}+${sc.current.version}-forge"
group = property('mod.group')
base.archivesName = "${property('mod.id')}-forge"

def requiredJava = sc.current.parsed >= '26.1' ? 25 : (sc.current.parsed >= '1.20.5' ? 21 : 17)
def requiresProductionRemap = sc.current.parsed < '1.20.5'
def forgeVersion = project.property('deps.forge')
def lwjglVersion = project.property('deps.lwjgl')
java {
    toolchain.languageVersion = JavaLanguageVersion.of(Math.max(requiredJava, 21))
    sourceCompatibility = JavaVersion.toVersion(requiredJava)
    targetCompatibility = JavaVersion.toVersion(requiredJava)
    withSourcesJar()
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

configurations {
    assimpNatives

}

configurations.assimpNatives {
    transitive = false
}

jarJar.register {
    archiveClassifier = requiresProductionRemap ? 'unmapped' : null
}

configurations {
    forgeDevLibraries {
        extendsFrom configurations.jarJar
        canBeResolved = true
        canBeConsumed = false
    }
}

minecraft {
    if (sc.current.parsed < '26.1') {
        mappings channel: 'official', version: sc.current.version
    }
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            if (!requiresProductionRemap) args "--mixin.config=amnetic.mixins.json"
            extraLibraries configurations.forgeDevLibraries, configurations.assimpNatives
            systemProperty 'forge.enabledGameTestNamespaces', property('mod.id')
            args '--mixin.config=amnetic.mixins.json'
            mods {
                amnetic {
                    source sourceSets.main
                }
            }
        }
        register('client') {
            if (sc.current.parsed >= '26.2') systemProperty 'max.bg.threads', findProperty('client_worker_count') ?: '4'
        }
        register('server') {
            args '--nogui'
        }
    }
}

dependencies {
    if (sc.current.parsed < '1.21.9') {
        compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
        if (requiresProductionRemap) annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.5'
        implementation 'io.github.llamalad7:mixinextras-forge:0.5.5'
        jarJar 'io.github.llamalad7:mixinextras-forge:0.5.5'
    }
    add('implementation', minecraft.dependency("net.minecraftforge:forge:${sc.current.version}-${forgeVersion}"))

    add('jarJar', 'de.javagl:jgltf-model:2.0.4')
    add('jarJar', 'de.javagl:jgltf-impl-v2:2.0.4')
    add('jarJar', 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2')
    add('jarJar', 'com.fasterxml.jackson.core:jackson-core:2.13.4')
    add('jarJar', 'com.fasterxml.jackson.core:jackson-annotations:2.13.4')
    add('implementation', 'de.javagl:jgltf-model:2.0.4')
    add('implementation', 'de.javagl:jgltf-impl-v2:2.0.4')
    add('implementation', 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2')
    add('implementation', 'com.fasterxml.jackson.core:jackson-core:2.13.4')
    add('implementation', 'com.fasterxml.jackson.core:jackson-annotations:2.13.4')
    add('implementation', files(rootProject.file('libs/bb4j.jar')))

    add('jarJar', "org.lwjgl:lwjgl-assimp:${lwjglVersion}")
    add('implementation', "org.lwjgl:lwjgl-assimp:${lwjglVersion}")
    add('runtimeOnly', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows")
    add('runtimeOnly', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-linux")
    add('runtimeOnly', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos")
    add('runtimeOnly', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos-arm64")
    add('assimpNatives', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows")
    add('assimpNatives', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-linux")
    add('assimpNatives', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos")
    add('assimpNatives', "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos-arm64")
    add('compileOnly', 'io.github.spair:imgui-java-binding:1.92.0')
    if (sc.current.parsed >= '26.2') {
        add('implementation', 'io.github.spair:imgui-java-binding:1.92.0')
        add('jarJar', 'io.github.spair:imgui-java-binding:1.92.0')
        add('implementation', "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}")
        add('jarJar', "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}")
        ['windows', 'linux', 'macos'].each { platform ->
            add('jarJar', "io.github.spair:imgui-java-natives-${platform}:1.92.0")
            add('runtimeOnly', "io.github.spair:imgui-java-natives-${platform}:1.92.0")
        }
        ['natives-windows', 'natives-linux', 'natives-macos', 'natives-macos-arm64'].each { platform ->
            add('runtimeOnly', "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}:${platform}")
            add('assimpNatives', "org.lwjgl:lwjgl-tinyfd:${lwjglVersion}:${platform}")
        }
    }
    testImplementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"

    if (requiresProductionRemap) {
        add('annotationProcessor', 'org.spongepowered:mixin:0.8.7:processor')
    }
}

if (requiresProductionRemap) {
    renamer.enableMixinRefmaps {
        config 'amnetic.mixins.json'
    }
    renamer.classes(tasks.named('jarJar', Jar)) {
        output = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
        mappings renamer.mixin.generatedMappings
    }
    renamer.mappings(minecraft.dependency.toSrg)
}

def absentClasses = ['mixin/WindowGlContextMixin', 'NeoForgeClientEvents']
if (sc.current.parsed < '26.2') absentClasses.addAll(["mixin/FirstPersonItemMixin","mixin/RenderPearlGameRendererMixin","mixin/accessor/GameRendererAccessor","client/framebuffer/internal/NativeFramebuffer","client/grade/internal/NativeColorGrade","client/ui/NativeEditorBackend","client/ssao/internal/NativeSsaoPass", "client/shadow/internal/NativeLocalShadows","client/light/internal/NativeDeferredLighting","client/gbuffer/internal/NativeNormalFill","client/render/NativeScreenProgram","client/render/NativePassDescriptors","client/render/NativeShaderSource262","client/instanced/internal/NativeInstanceRenderer","client/post/internal/NativePostPipeline","client/decal/internal/NativeDecalRenderer","client/light/internal/TiledLighting","client/light/internal/ScatteringLights","client/ui/AmneticEditor","client/ui/TexturePreview","client/ui/inspector/GBufferInspector"])
if (sc.current.parsed < '26.3') absentClasses.addAll(["mixin/NativeTextureUnitsMixin", "mixin/NativeCommandBatchMixin","mixin/NativeLevelStagesMixin","mixin/NativeMaterialBindMixin","mixin/NativeMaterialDisposeMixin","mixin/NativeMaterialPassMixin","mixin/NativeMaterialPipelinesMixin","client/gbuffer/internal/NativeWorldMaterials","client/pipeline/internal/NativeLayers"])
if (sc.current.parsed >= '26.2') absentClasses.addAll(['mixin/IrisPipelineMixin', 'mixin/GameRendererMixin', 'mixin/GlCommandEncoderMixin', 'mixin/ItemInHandRendererMixin'])
if (sc.current.version == '26.2') absentClasses.add('mixin/FirstPersonItemMixin')
if (sc.current.parsed >= '26.3') absentClasses.addAll(['client/render/NativePassDescriptors', 'client/render/NativeShaderSource262'])
if (sc.current.parsed < '1.20.2') absentClasses.add('mixin/accessor/LevelRendererAccessor')
if (sc.current.parsed < '1.21.2') absentClasses.addAll(['mixin/EntityRenderStateMixin', 'mixin/EntityRendererMixin', 'mixin/WeatherEffectRendererMixin'])
if (sc.current.parsed < '1.21.5') absentClasses.addAll(['mixin/GlCommandEncoderMixin', 'client/render/MeshPipeline',
        'client/entityfx/internal/EntityEffectPipeline', 'client/framebuffer/internal/WrappedGlTexture',
        'mixin/accessor/RenderTypeInvoker'])
if (sc.current.parsed >= '1.21.5') absentClasses.add('mixin/accessor/LightTextureAccessor')
if (sc.current.parsed < '26.2') absentClasses.add('mixin/accessor/GameRendererAccessor')

tasks.withType(JavaCompile).configureEach {
    absentClasses.each { path -> exclude("com/meekdev/amnetic/${path}.java") }
    exclude('com/meekdev/amnetic/client/AmneticDataGenerator.java')
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
    options.release = requiredJava
}

processResources {
    inputs.property('absentClasses', absentClasses)
    inputs.property('javaCompatibility', requiredJava)
    inputs.property('mixinCompatibility', Math.min(requiredJava, 21))
    exclude('fabric.mod.json')
    filesMatching('amnetic.mixins.json') {
        expand java: "JAVA_${Math.min(requiredJava, 21)}"
        filter { line -> absentClasses.any { line.trim().replaceAll(',$', '') == "\"${it.replaceFirst('^mixin/', '').replace('/', '.')}\"" } ? '' : line }
    }
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraft_version: sc.current.version,
                forge_version: forgeVersion
    }
    doLast {
        def format = sc.current.parsed >= '26.3' ? 121 : (sc.current.parsed >= '26.2' ? 88 : (sc.current.parsed < '1.20.5' ? 15 : (sc.current.parsed < '26.1' ? 34 : 75)))
        def pack = [description: 'Amnetic resources', pack_format: format]
        if (sc.current.parsed >= '1.21.9') {
            def range = sc.current.parsed >= '26.3' ? [[97, 1], [121, 0]] : (sc.current.parsed >= '26.2' ? [[88, 0], [107, 1]] : (sc.current.parsed >= '26.1' ? [[84, 0], [101, 1]] : [[75, 0], [94, 1]]))
            pack.min_format = range[0]
            pack.max_format = range[1]
        }
        new File(destinationDir, 'pack.mcmeta').text = groovy.json.JsonOutput.toJson([pack: pack])
    }
}

jar {
    archiveClassifier = 'slim'
    from(rootProject.file('LICENSE.txt')) { rename { "${it}_amnetic" } }
    from(zipTree(rootProject.file('libs/bb4j.jar'))) {
        exclude 'META-INF/**', 'org/lwjgl/**'
    }
    from({ configurations.assimpNatives.collect { zipTree(it) } }) { exclude 'META-INF/**' }
    manifest {
        attributes 'MixinConfigs': 'amnetic.mixins.json'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${property('mod.id')}-forge"
            from components.java
        }
    }
}

tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
    dependsOn tasks.named('stonecutterGenerate')
}

tasks.withType(JavaExec).matching { it.name.startsWith('run') }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(requiredJava)
    }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.withType(Test).configureEach { failOnNoDiscoveredTests = false }

apply from: rootProject.file("gradle/client-runtime.gradle")
