plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = rootProject.mod_version + "-examples"
group = "com.example"

base {
    archivesName = "amnetic-examples"
}

repositories {
    maven {
        url = "https://maven.quiltmc.org/repository/release"
        name = "Quilt"
    }
}

def loaderPlatform = providers.gradleProperty("loader_platform").getOrElse("fabric")

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    if (loaderPlatform == "quilt") {
        implementation "org.quiltmc:quilt-loader:${rootProject.quilt_loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    }
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // depend on the Amnetic lib; both projects use the same (Mojang) mappings, so no remap is needed
    implementation project(':')
}

if (loaderPlatform == "quilt") {
    def fabricApiJar = configurations.runtimeClasspath.incoming.artifactView {
        componentFilter { component ->
            component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    component.group == "net.fabricmc.fabric-api" && component.module == "fabric-api"
        }
    }.files
    def prepareQuiltRunMods = tasks.register("prepareQuiltRunMods", Sync) {
        dependsOn tasks.named("jar"), rootProject.tasks.named("jar")
        from tasks.named("jar").flatMap { it.archiveFile }
        from rootProject.tasks.named("jar").flatMap { it.archiveFile }
        from fabricApiJar
        into layout.buildDirectory.dir("run/quilt/mods")
    }

    loom.runs.configureEach {
        runDir "build/run/quilt"
    }
    tasks.matching { it.name.startsWith("run") }.configureEach {
        dependsOn prepareQuiltRunMods
    }
}

loom {
    mods {
        "amnetic-examples" {
            sourceSet sourceSets.main
        }
        // load the Amnetic lib as a mod in the examples dev run (the examples mod depends on it)
        "amnetic" {
            sourceSet project(":").sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}
