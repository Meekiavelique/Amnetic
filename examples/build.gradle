plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = rootProject.mod_version + "-examples"
group = "com.example"

base {
    archivesName = "amnetic-examples"
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // depend on the Amnetic lib; both projects use the same (Mojang) mappings, so no remap is needed
    implementation project(':')
}

loom {
    mods {
        "amnetic-examples" {
            sourceSet sourceSets.main
        }
        // load the Amnetic lib as a mod in the examples dev run (the examples mod depends on it)
        "amnetic" {
            sourceSet project(":").sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}
