name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if [ "$attempt" -eq 3 ] || ! grep -q 'java\..*Exception: Connection reset' "$RUNNER_TEMP/gradle-build.log"; then
              exit "$status"
            fi
            echo "Dependency connection reset; retrying in 15 seconds ($attempt/3)."
            sleep 15
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            versions/*/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
