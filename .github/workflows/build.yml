name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - loader: fabric
            task: ":build :examples:build -Ploader_platform=fabric"
            artifacts: "build/libs/"
          - loader: quilt
            task: ":build :examples:build -Ploader_platform=quilt"
            artifacts: "build/libs/"
          - loader: neoforge
            task: ":neoforge:build"
            artifacts: "neoforge/build/libs/"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ${{ matrix.task }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.loader }}
          path: ${{ matrix.artifacts }}
